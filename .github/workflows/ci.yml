name: FinCalc CI - Quality & Unit Testing Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-lint-test:
    name: Build, Static Analysis & Automated Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validação de Sintaxe (Compilação Nativa)
      run: |
        python -m py_compile fincalc.py
        python -m py_compile tests/test_*.py

    - name: Análise Estática de Estilo (Flake8)
      run: flake8 fincalc.py tests/

    - name: Auditoria de Segurança (Bandit)
      run: bandit -r fincalc.py

    - name: Executar Testes Unitários e Cobertura (Pytest)
      run: |
        python -m pytest tests/ -v --cov=fincalc --cov-report=term-missing --cov-report=html:coverage_report

    - name: Publicar Artefato do Relatório de Cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-html
        path: coverage_report/

  deploy-simulado-codespaces:
    name: CD - Deploy Simulado no Codespaces
    runs-on: self-hosted
    needs: build-lint-test

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Simular Implantação no Servidor de Produção do Codespace
      run: |
        echo "🚀 Iniciando processo de deploy automático no servidor local..."
        mkdir -p /tmp/servidor_producao_fincalc
        cp -r *.py /tmp/servidor_producao_fincalc/
        echo "📦 Arquivos da aplicação copiados para /tmp/servidor_producao_fincalc/"
        python3 -m py_compile /tmp/servidor_producao_fincalc/fincalc.py
        echo "✅ DEPLOY CONCLUÍDO COM SUCESSO!"
        echo "A aplicação FinCalc está 'no ar' e pronta para execução em produção."
